<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff5f3" />
    <script>
      try {
        var saved = localStorage.getItem('doro-theme')
        var night =
          saved === 'night' ||
          (saved !== 'day' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (night) {
          document.documentElement.dataset.theme = 'night'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#241820')
        }
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="DORO 的小世界 — Sty 用来安放代码、笔记和日常的小角落。"
    />
    <title>DORO 的小世界</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
